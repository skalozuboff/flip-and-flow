<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>FLIP & FLOW 0.4.1</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1422;color:#edf5ff;font:16px system-ui;display:flex;justify-content:center}main{width:min(100%,440px);padding:16px}h1{letter-spacing:4px;margin:4px 0}small{color:#9aafc8}.stats,.buttons{display:flex;gap:8px;margin:12px 0}.stats div,button{flex:1;background:#20334b;border:1px solid #38516d;border-radius:12px;padding:10px;color:white;text-align:center}button{font:inherit;cursor:pointer}button:disabled{opacity:.35}canvas{width:100%;background:#101c2d;border-radius:16px;touch-action:none;display:block}#msg{min-height:48px;text-align:center;color:#a9e9db;padding:10px}#power{background:#58408b}b{display:block;font-size:22px}#levels{position:fixed;inset:0;margin:auto;width:min(94vw,440px);max-height:85vh;overflow:auto;background:#15263b;color:white;border:1px solid #48627e;border-radius:20px;padding:20px}#levels::backdrop{background:#050b16bb}#tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#tiles button{padding:8px 2px;min-height:64px}#tiles span{display:block;color:#ffd36a;font-size:12px}#victory{color:#ffd36a;text-align:center;font-size:30px;letter-spacing:8px;min-height:0}#victory:not(:empty){animation:pop .45s ease-out}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}</style><main><h1>FLIP & FLOW</h1><small>GRAVITY × CHAIN · 0.4.1</small><div class="buttons"><button onclick="showLevels()">▦ Уровни</button><button onclick="showLevels()">★ <span id="total">0</span> · Рекорд <span id="record">0</span></button></div><div class="stats"><div>Уровень<b id="lv">1</b></div><div>Ходы<b id="mv">12</b></div><div>Очки<b id="sc">0</b></div></div><canvas id="c" width="360" height="420"></canvas><div id="victory" aria-live="polite"></div><div id="msg"></div><div class="buttons"><button onclick="move(-1,0)">←</button><button onclick="move(0,-1)">↑</button><button onclick="move(0,1)">↓</button><button onclick="move(1,0)">→</button></div><div class="buttons"><button id="power" onclick="pulse()">✦ Импульс</button><button onclick="undo()">↶</button><button onclick="start()">↻</button><button id="next" onclick="level++;start()">Далее</button></div><div class="buttons"><button onclick="sound=!sound;this.textContent=sound?'Звук: вкл':'Звук: выкл'">Звук: вкл</button><button onclick="showLevels()">Прогресс</button></div><small>Свайпни поле. Группы из 3+ соседних шариков исчезают. Комбо заряжает импульс, который удаляет выбранный автоматически цвет.</small></main><dialog id="levels"><h2>Уровни</h2><p id="summary"></p><div id="tiles"></div><div class="buttons"><button onclick="$('levels').close()">Закрыть</button></div></dialog><script>
const $=id=>document.getElementById(id),c=$('c'),g=c.getContext('2d'),C=['#ff627d','#52d8ff','#ffd36a','#72efa7','#bd91ff'];let level=1,moves,score,charge,balls,walls,particles=[],busy=false,won=false,history=[],epoch=0,sound=true,endless=false,audio;let progress={unlocked:1,levels:{},record:0,current:1},optimal=0;try{let p=JSON.parse(localStorage.getItem('flip-flow-progress-v1'));if(p&&p.levels&&Number.isInteger(p.unlocked)&&p.unlocked>=1)progress=p}catch(e){}level=Math.max(1,Math.min(progress.unlocked,progress.current||1));function save(){try{localStorage.setItem('flip-flow-progress-v1',JSON.stringify(progress))}catch(e){}}function totals(){let a=Object.values(progress.levels);$('total').textContent=a.reduce((n,v)=>n+v.stars,0);$('record').textContent=progress.record||0}function showLevels(){if(busy)return;let d=$('levels'),t=$('tiles');t.replaceChildren();$('summary').textContent='Пройдено: '+Object.keys(progress.levels).length+' · Звёзды: '+$('total').textContent;let max=Math.max(12,progress.unlocked+4);for(let i=1;i<=max;i++){let b=document.createElement('button'),a=progress.levels[i];b.textContent=i;let z=document.createElement('span');z.textContent=a?'★'.repeat(a.stars)+'☆'.repeat(3-a.stars):i<=progress.unlocked?'Доступен':'🔒';b.append(z);b.disabled=i>progress.unlocked;b.onclick=()=>{level=i;d.close();start()};t.append(b)}if(!d.open)d.showModal()}const key=(x,y)=>x+','+y;function tone(n){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),a=audio.createGain();o.frequency.value=420+n*140;a.gain.setValueAtTime(.08,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.connect(a);a.connect(audio.destination);o.start();o.stop(audio.currentTime+.17)}catch(e){}}function stats(){$('lv').textContent=level;$('mv').textContent=moves;$('mv').title='Три звезды: осталось потратить не более '+Math.max(0,moves-2)+' ходов';$('sc').textContent=score;$('power').textContent='✦ Импульс '+charge+'/3';$('power').disabled=charge<3||busy||won;$('next').disabled=!won}function say(t){$('msg').textContent=t}function generate(l){let seed=(l*2654435761)>>>0;function rnd(n){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed%n}const dirs=[[0,1],[1,0],[0,-1],[-1,0]];function solve(b,w,limit){let q=[{b,d:0}],seen=new Set();for(let i=0;i<q.length&&i<9000;i++){let a=q[i];if(!a.b.length)return a.d;if(a.d>=limit)continue;for(let [dx,dy] of dirs){let z=a.b.map(v=>({...v}));while(true){let occ=new Set(z.map(v=>key(v.x,v.y)));for(let v of [...z].sort((a,b)=>(b.x-a.x)*dx+(b.y-a.y)*dy)){occ.delete(key(v.x,v.y));while(v.x+dx>=0&&v.x+dx<6&&v.y+dy>=0&&v.y+dy<7&&!w.has(key(v.x+dx,v.y+dy))&&!occ.has(key(v.x+dx,v.y+dy))){v.x+=dx;v.y+=dy}occ.add(key(v.x,v.y))}let hit=new Set(),visited=new Set();for(let v of z){if(visited.has(v))continue;let g=[v];visited.add(v);for(let a of g)for(let b of z)if(!visited.has(b)&&a.k===b.k&&Math.abs(a.x-b.x)+Math.abs(a.y-b.y)===1){visited.add(b);g.push(b)}if(g.length>=3)g.forEach(v=>hit.add(v))}if(!hit.size)break;z=z.filter(v=>!hit.has(v))}let k=z.map(v=>v.x+','+v.y+','+v.k).sort().join(';');if(!seen.has(k)){seen.add(k);q.push({b:z,d:a.d+1})}}}return -1}let best=null;for(let t=0;t<160;t++){let cells=Array.from({length:42},(_,i)=>i);for(let i=41;i>0;i--){let j=rnd(i+1);[cells[i],cells[j]]=[cells[j],cells[i]]}let n=Math.min(5,3+Math.floor(l/8)),b=cells.slice(0,n*3).map((v,i)=>({x:v%6,y:Math.floor(v/6),k:Math.floor(i/3),px:v%6,py:Math.floor(v/6)})),w=new Set(cells.slice(n*3,n*3+Math.min(4,Math.floor(l/4))).map(v=>key(v%6,Math.floor(v/6))));let d=solve(b,w,9);if(d>=1&&(!best||d>best.d))best={b,w,d};if(d>=Math.min(5,2+Math.floor(l/4)))return {b,w,d}}return best}function start(){$("victory").textContent="";progress.current=level;save();totals();epoch++;busy=won=false;history=[];particles=[];score=charge=0;let a=generate(level);if(!a){say('Не удалось создать уровень. Попробуй снова.');balls=[];walls=new Set();moves=0;stats();return}balls=a.b;walls=a.w;optimal=a.d;moves=a.d+3;say('★★★ за '+(a.d+1)+' ходов или меньше');stats()}function snapshot(){history.push(JSON.stringify({balls,moves,score,charge}))}function undo(){if(busy||won||!history.length)return;Object.assign(window,{});let h=JSON.parse(history.pop());balls=h.balls;moves=h.moves;score=h.score;charge=h.charge;won=false;stats();say('Ход отменён')}function settle(dx,dy){let occ=new Set(balls.map(b=>key(b.x,b.y)));for(let b of [...balls].sort((a,b)=>(b.x-a.x)*dx+(b.y-a.y)*dy)){occ.delete(key(b.x,b.y));while(true){let x=b.x+dx,y=b.y+dy,k=key(x,y);if(x<0||x>=6||y<0||y>=7||occ.has(k)||walls.has(k))break;b.x=x;b.y=y}occ.add(key(b.x,b.y))}}function matches(){let seen=new Set(),out=new Set();for(let b of balls){if(seen.has(b))continue;let q=[b];seen.add(b);for(let a of q)for(let z of balls)if(!seen.has(z)&&a.k===z.k&&Math.abs(a.x-z.x)+Math.abs(a.y-z.y)===1){seen.add(z);q.push(z)}if(q.length>=3)q.forEach(z=>out.add(z))}for(let b of out)if(b.bomb)for(let z of balls)if(Math.abs(z.x-b.x)+Math.abs(z.y-b.y)<=1)out.add(z);return out}function burst(b){for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*4;particles.push({x:18+b.x*54+27,y:21+b.y*54+27,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,k:b.k})}}const wait=t=>new Promise(r=>setTimeout(r,t));async function move(dx,dy){if(busy||won||moves<=0)return;snapshot();busy=true;let e=epoch;moves--;stats();let combo=0;while(true){settle(dx,dy);await wait(320);if(e!==epoch)return;let m=matches();if(!m.size)break;combo++;m.forEach(burst);balls=balls.filter(b=>!m.has(b));score+=m.size*100*combo;charge=Math.min(3,charge+1);tone(combo);if(combo>1)navigator.vibrate?.(30);say(combo>1?'ЦЕПНАЯ РЕАКЦИЯ ×'+combo:'+'+m.size*100);stats();await wait(180);if(e!==epoch)return}busy=false;finish(combo)}function finish(combo){won=!balls.length;if(won){let used=optimal+3-moves,stars=used<=optimal+1?3:used<=optimal+2?2:1;let old=progress.levels[level];progress.levels[level]={stars:Math.max(stars,old?.stars||0),moves:Math.min(used,old?.moves??Infinity),score:Math.max(score,old?.score||0)};progress.record=Math.max(progress.record||0,score);progress.unlocked=Math.max(progress.unlocked,level+1);save();totals();$('victory').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);say('Уровень пройден! '+used+' ходов');tone(5);navigator.vibrate?.([30,40,30]);for(let i=0;i<12;i++)burst({x:i%6,y:Math.floor(i/6)+2,k:i%5})}else if(!moves)say('Ходы закончились. Отмени ход или начни заново.');else if(!combo)say('Попробуй другое направление');stats()}function pulse(){if(busy||won||charge<3)return;snapshot();charge=0;let k=balls[0]?.k;balls.filter(b=>b.k===k).forEach(burst);balls=balls.filter(b=>b.k!==k);tone(4);say('Гравитационный импульс!');finish(1)}function draw(){g.clearRect(0,0,360,420);for(let y=0;y<7;y++)for(let x=0;x<6;x++){g.fillStyle=walls.has(key(x,y))?'#65758c':(x+y)%2?'#18273a':'#1c2c40';g.beginPath();g.roundRect(20+x*54,23+y*54,50,50,9);g.fill()}for(let b of balls){b.px+=(b.x-b.px)*.19;b.py+=(b.y-b.py)*.19;let x=45+b.px*54,y=48+b.py*54,r=21;let a=g.createRadialGradient(x-7,y-9,1,x,y,r);a.addColorStop(0,'#fff');a.addColorStop(.3,C[b.k]);a.addColorStop(1,C[b.k]+'66');g.fillStyle=a;g.shadowColor=C[b.k];g.shadowBlur=10;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.shadowBlur=0;if(b.bomb){g.fillStyle='#fff';g.font='22px system-ui';g.textAlign='center';g.fillText('★',x,y+7)}}for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=.025;g.globalAlpha=Math.max(0,p.life);g.fillStyle=C[p.k];g.beginPath();g.arc(p.x,p.y,3,0,7);g.fill()}g.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(draw)}let p;c.onpointerdown=e=>{p=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointerup=e=>{if(!p)return;let x=e.clientX-p[0],y=e.clientY-p[1];p=null;if(Math.max(Math.abs(x),Math.abs(y))<12)return;Math.abs(x)>Math.abs(y)?move(Math.sign(x),0):move(0,Math.sign(y))};window.onkeydown=e=>{let d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(d){e.preventDefault();move(...d)}};start();draw();</script></html>
